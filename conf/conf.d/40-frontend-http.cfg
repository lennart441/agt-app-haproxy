frontend http_in
   bind :80
   bind :::80 v6only

   # Clusterweites Verbindungslimit
   http-request track-sc1 str(global) table st_global_conn
   acl too_many_conn sc1_conn_cur(st_global_conn) ge __CLUSTER_MAXCONN__
   http-request deny deny_status 503 if too_many_conn

   # Geo-Check vor Redirect → eigene 403-Seite (403-geo.http)
   # geo_blocklist.map enthält nur geblockte CIDRs als "network\t1".
   acl is_blocked_geo_http src,map_ip(/usr/local/etc/haproxy/maps/geo_blocklist.map) -m found
   acl is_whitelisted_http src,map_ip(/usr/local/etc/haproxy/maps/whitelist.map) -m found
   http-request redirect scheme https code 301 if !is_blocked_geo_http or is_whitelisted_http
   use_backend be_403_geo if is_blocked_geo_http !is_whitelisted_http
